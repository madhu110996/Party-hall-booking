<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#241B2E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Bookings" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" href="icon-192.png" />
<title>Hall Bookings</title>
<style>
  :root{
    --ink:#241B2E; --ink-soft:#4A3F52; --bg:#FAF6F0; --surface:#FFFFFF; --line:#E7DFD2;
    --gold:#AD8A2E; --gold-ink:#241B2E; --rose:#93384A; --rose-bg:#F7E9EC;
    --green:#3F7A57; --green-bg:#E9F2EC; --muted:#8B8390; --muted-bg:#F1EDE6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  .display{ font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif; }
  #app{ max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative; padding-bottom:96px; }
  header.topbar{ position:sticky; top:0; z-index:20; background:var(--bg); padding:22px 20px 12px; border-bottom:1px solid var(--line); }
  .title-row{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  h1.display{ font-size:26px; font-weight:600; margin:0; letter-spacing:0.2px; }
  .tagline{ font-size:12.5px; color:var(--muted); margin-top:3px; }
  .sync-dot{ width:7px;height:7px;border-radius:50%; background:var(--green); display:inline-block; margin-right:5px; transition:background .25s ease; }
  .sync-dot.busy{ background:var(--gold); }
  .sync-dot.err{ background:var(--rose); }
  .share-banner{
    margin-top:12px; background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; font-size:12.5px; color:var(--ink-soft);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .share-banner button{ background:var(--ink); color:#fff; border:none; border-radius:7px; padding:7px 10px; font-size:12px; font-family:inherit; cursor:pointer; white-space:nowrap; }
  .whoami{ margin-top:12px; }
  .whoami input{ width:100%; font-size:13.5px; padding:8px 10px; border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--ink); font-family:inherit; }
  .whoami label{ font-size:11px; color:var(--muted); display:block; margin-bottom:4px; }
  .tabs{ display:flex; gap:4px; margin-top:16px; border-bottom:1px solid var(--line); overflow-x:auto; }
  .tab{ background:none;border:none; font-family:inherit;font-size:14px;font-weight:500; color:var(--muted); padding:9px 12px 11px; cursor:pointer; position:relative; top:1px; white-space:nowrap; }
  .tab.active{ color:var(--ink); border-bottom:2px solid var(--gold); }
  .searchwrap{ padding:14px 20px 0; }
  .searchwrap input{ width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--surface); font-family:inherit; font-size:14px; color:var(--ink); }
  .searchwrap input::placeholder{ color:var(--muted); }
  main{ padding:14px 20px 8px; }
  .empty{ text-align:center; color:var(--muted); font-size:14px; padding:56px 16px; line-height:1.6; }
  .errbox{ text-align:center; color:var(--rose); font-size:14px; padding:40px 16px; line-height:1.6; }
  .errbox .tech{ font-size:11.5px; color:var(--muted); margin-top:8px; word-break:break-word; }
  .errbox button{ margin-top:14px; background:var(--ink); color:#fff; border:none; border-radius:9px; padding:10px 16px; font-family:inherit; font-size:13.5px; cursor:pointer; }
  .row{ background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--muted); border-radius:10px; padding:13px 14px; margin-bottom:10px; cursor:pointer; }
  .row.status-paid{ border-left-color:var(--green); }
  .row.status-partial{ border-left-color:var(--gold); }
  .row.status-pending{ border-left-color:var(--rose); }
  .row.status-cancelled{ border-left-color:var(--line); opacity:0.68; }
  .row-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .row-date{ font-size:12.5px; color:var(--muted); font-weight:600; white-space:nowrap; }
  .row-slot{ font-size:11.5px; color:var(--muted); }
  .row-name{ font-size:15.5px; font-weight:600; margin-top:3px; }
  .row-event{ font-size:12.5px; color:var(--ink-soft); margin-top:1px; }
  .row-bottom{ display:flex; justify-content:space-between; align-items:center; margin-top:9px; }
  .pill{ font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:20px; }
  .pill.status-paid{ background:var(--green-bg); color:var(--green); }
  .pill.status-partial{ background:#FBF1DE; color:#8A6A1E; }
  .pill.status-pending{ background:var(--rose-bg); color:var(--rose); }
  .pill.status-cancelled{ background:var(--muted-bg); color:var(--muted); }
  .row-amt{ font-size:13px; color:var(--ink-soft); text-align:right; }
  .row-amt b{ color:var(--ink); }
  .fab{ position:fixed; bottom:26px; left:calc(50% - 240px + 20px); background:var(--gold); color:var(--gold-ink); border:none; border-radius:28px; padding:14px 20px; font-size:14.5px; font-weight:600; font-family:inherit; box-shadow:0 4px 14px rgba(173,138,46,0.45); cursor:pointer; z-index:25; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .fab .fab-plus{ font-size:18px; line-height:1; }
  @media (max-width:520px){ .fab{ left:20px; } }
  .sheet-backdrop{ position:fixed;inset:0; background:rgba(36,27,46,0.32); z-index:40; display:flex; align-items:flex-end; justify-content:center; }
  .sheet{ background:var(--bg); width:100%; max-width:480px; border-radius:20px 20px 0 0; max-height:92vh; overflow-y:auto; padding:22px 20px 28px; animation:sheetup .22s ease-out; position:relative; }
  @keyframes sheetup{ from{ transform:translateY(24px); opacity:0.4; } to{ transform:translateY(0); opacity:1; } }
  .sheet h2.display{ font-size:20px; margin:0 0 16px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; color:var(--muted); margin-bottom:5px; font-weight:600; }
  .field input, .field select, .field textarea{ width:100%; padding:10px 11px; border:1px solid var(--line); border-radius:9px; background:var(--surface); font-family:inherit; font-size:15px; color:var(--ink); }
  .field textarea{ resize:vertical; min-height:56px; }
  .row2{ display:flex; gap:10px; }
  .row2 .field{ flex:1; }
  .pending-line{ display:flex; justify-content:space-between; font-size:14px; padding:11px 2px; border-top:1px dashed var(--line); margin-top:2px; }
  .pending-line b{ font-size:16px; }
  .conflict{ background:var(--rose-bg); color:var(--rose); font-size:13px; padding:10px 12px; border-radius:9px; margin:6px 0 14px; line-height:1.45; }
  .saveerr{ background:var(--rose-bg); color:var(--rose); font-size:13px; padding:10px 12px; border-radius:9px; margin:6px 0 14px; line-height:1.45; }
  .btnrow{ display:flex; gap:10px; margin-top:18px; }
  button.primary{ flex:1; background:var(--ink); color:#fff; border:none; padding:13px; border-radius:10px; font-size:15px; font-weight:600; font-family:inherit; cursor:pointer; }
  button.primary:disabled{ background:var(--muted); cursor:not-allowed; }
  button.ghost{ background:none; border:1px solid var(--line); color:var(--ink-soft); padding:13px; border-radius:10px; font-size:15px; font-family:inherit; cursor:pointer; }
  .danger-zone{ margin-top:22px; padding-top:16px; border-top:1px solid var(--line); display:flex; gap:10px; }
  .danger-zone button{ flex:1; font-size:13.5px; padding:10px; border-radius:9px; font-family:inherit; cursor:pointer; }
  .btn-cancel-booking{ background:var(--rose-bg); color:var(--rose); border:1px solid transparent; }
  .btn-delete{ background:none; color:var(--muted); border:1px solid var(--line); }
  .btn-restore{ background:var(--green-bg); color:var(--green); border:1px solid transparent; flex:1; padding:10px; border-radius:9px; font-family:inherit; font-size:13.5px; cursor:pointer; }
  .close-x{ background:none;border:none; font-size:22px; color:var(--muted); position:absolute; right:16px; top:16px; cursor:pointer; }
  .meta{ font-size:11.5px; color:var(--muted); margin-top:2px; }

  .cal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .cal-month{ font-size:17px; font-weight:600; }
  .cal-nav{ background:var(--surface); border:1px solid var(--line); border-radius:8px; width:34px;height:34px; font-size:18px; color:var(--ink); cursor:pointer; }
  .cal-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:11px; color:var(--muted); margin-bottom:5px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cal-cell{ aspect-ratio:1/1; border-radius:8px; border:1px solid var(--line); background:var(--surface); position:relative; cursor:pointer; padding:5px; }
  .cal-cell.cal-blank{ border:none; background:transparent; cursor:default; }
  .cal-daynum{ font-size:12px; color:var(--ink-soft); font-weight:600; }
  .cal-cell.cal-full{ background:var(--rose-bg); border-color:var(--rose); }
  .cal-cell.cal-full .cal-daynum{ color:var(--rose); }
  .cal-cell.cal-half-day{ background:linear-gradient(90deg, #FBF1DE 0 50%, var(--surface) 50% 100%); border-color:var(--gold); }
  .cal-cell.cal-half-evening{ background:linear-gradient(90deg, var(--surface) 0 50%, #FBF1DE 50% 100%); border-color:var(--gold); }
  .cal-cell.cal-today{ box-shadow:0 0 0 2px var(--ink) inset; }
  .cal-legend{ display:flex; gap:14px; margin-top:14px; font-size:11.5px; color:var(--muted); flex-wrap:wrap; }
  .cal-legend .dot{ display:inline-block; width:9px;height:9px;border-radius:3px; margin-right:4px; vertical-align:middle; }
  .dot-full{ background:var(--rose); }
  .dot-half{ background:#E8B94E; }
  .dot-empty{ background:var(--surface); border:1px solid var(--line); }

  .alerts-btn{ background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:11px; color:var(--ink-soft); font-family:inherit; cursor:pointer; white-space:nowrap; flex-shrink:0; }
  .alerts-btn.on{ background:var(--green-bg); color:var(--green); border-color:transparent; }
  .toast-stack{ position:fixed; top:10px; left:50%; transform:translateX(-50%); width:calc(100% - 24px); max-width:456px; z-index:60; display:flex; flex-direction:column; gap:8px; }
  .toast{ background:var(--ink); color:#fff; font-size:13px; padding:11px 14px; border-radius:10px; box-shadow:0 6px 18px rgba(36,27,46,0.25); cursor:pointer; animation:toastin .2s ease-out; }
  .toast.type-cancel{ background:var(--rose); }
  .toast.type-restore{ background:var(--green); }
  @keyframes toastin{ from{ opacity:0; transform:translateY(-8px); } to{ opacity:1; transform:translateY(0); } }

  /* ---- installable app + offline additions ---- */
  header.topbar{ padding-top:calc(22px + env(safe-area-inset-top)); }
  #app{ padding-bottom:calc(96px + env(safe-area-inset-bottom)); }
  .fab{ bottom:calc(26px + env(safe-area-inset-bottom)); }
  .install-banner{ background:var(--ink); color:#fff; font-size:13px; line-height:1.4; padding:10px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; padding-top:calc(10px + env(safe-area-inset-top)); }
  .install-banner b{ font-weight:600; }
  .ib-actions{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .ib-main{ background:var(--gold); color:var(--gold-ink); border:none; border-radius:8px; padding:8px 12px; font-size:12.5px; font-weight:600; font-family:inherit; cursor:pointer; white-space:nowrap; }
  .ib-x{ background:none; border:none; color:#fff; font-size:22px; line-height:1; cursor:pointer; padding:0 4px; opacity:.8; }
  .install-banner + header.topbar{ padding-top:14px; }
  .issues{ padding:12px 20px 0; display:flex; flex-direction:column; gap:8px; }
  .issue{ background:var(--rose-bg); color:var(--rose); font-size:12.5px; line-height:1.45; padding:10px 12px; border-radius:10px; display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .issue button{ background:none; border:1px solid var(--rose); color:var(--rose); border-radius:7px; padding:4px 8px; font-size:11.5px; font-family:inherit; cursor:pointer; flex-shrink:0; }
  .setup{ padding:calc(48px + env(safe-area-inset-top)) 24px 40px; }
  .setup h1.display{ font-size:28px; margin:0 0 6px; }
  .setup-lead{ color:var(--ink-soft); font-size:14.5px; margin:0 0 22px; }
  .setup-btn{ width:100%; flex:none; display:block; }
  .setup-or{ text-align:center; color:var(--muted); font-size:12.5px; margin:20px 0 12px; }
  .setup-note{ color:var(--muted); font-size:12px; line-height:1.5; margin-top:18px; }
  .linkbtn{ background:none !important; color:var(--ink-soft) !important; text-decoration:underline; padding:6px !important; margin-top:4px !important; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  const CURRENCY = "\u20B9";
  const SLOT_LABEL = { full:"Full day", day:"Day", evening:"Evening" };
  const JSONBIN_BASE = "https://api.jsonbin.io/v3/b";
  const JSONBIN_KEY = "$2a$10$4fnLyv7pb7d0ChZN7aWVT.d0cHew83jv3FU6s9Gqg9P3QVDS0uEaC";

  const LAST_DOC_KEY = "hb_last_doc";
  const NAME_KEY = "hb_my_name";
  const IOS_HINT_KEY = "hb_ios_hint_dismissed";
  const cacheKey  = id => "hb_cache_"  + id;   // last bookings list seen from the server
  const queueKey  = id => "hb_queue_"  + id;   // changes made on this phone not yet synced
  const issuesKey = id => "hb_issues_" + id;   // changes that could not be synced (date taken)
  const seenKey   = id => "hb_seen_v2_" + id;  // for "new/cancelled booking" alerts

  let state = {
    docId: "",
    remote: [],          // last list received from the server
    queue: [],           // pending local changes
    bookings: [],        // what the screen shows = remote + pending changes
    tab: "upcoming",
    search: "",
    myName: "",
    openSheet: null,
    editingId: null,
    draft: null,
    conflict: null,
    saving: false,
    saveError: "",
    syncStatus: "loading",   // loading | ok | offline | error
    bootError: "",
    bootErrorTech: "",
    needsSetup: false,
    setupText: "",
    setupError: "",
    setupBusy: false,
    justShared: false,
    calMonth: null,
    dayDetail: null,
    toasts: [],
    issues: [],
    installEvt: null,
    installDismissed: false,
    showIosHint: false,
    installed: false
  };
  let toastCounter = 0;
  let booted = false;
  let loopsStarted = false;
  let flushing = false;
  let refreshing = false;
  let lastSig = "";

  // ---------- small helpers ----------

  function lsGet(k, fb){ try{ const raw = localStorage.getItem(k); return raw === null ? fb : JSON.parse(raw); }catch(e){ return fb; } }
  function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  function lsHas(k){ try{ return localStorage.getItem(k) !== null; }catch(e){ return false; } }

  function pad2(n){ return String(n).padStart(2,"0"); }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
  function fmtDate(iso){ const d=new Date(iso+"T00:00:00"); return d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short",year:"numeric"}); }
  function fmtMoney(n){ n=Number(n)||0; return CURRENCY+n.toLocaleString("en-IN"); }
  function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
  function addMonths(d,n){ return new Date(d.getFullYear(), d.getMonth()+n, 1); }
  function daysInMonth(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); }
  function isoOf(y,m,day){ return `${y}-${pad2(m+1)}-${pad2(day)}`; }
  function monthLabel(d){ return d.toLocaleDateString(undefined,{month:"long",year:"numeric"}); }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function escapeAttr(s){ return escapeHtml(s==null?"":s); }
  function withTimeout(p, ms){
    return new Promise((resolve,reject)=>{
      const t = setTimeout(()=>reject(new Error("timeout")), ms);
      p.then(v=>{ clearTimeout(t); resolve(v); }, e=>{ clearTimeout(t); reject(e); });
    });
  }

  function statusOf(b){
    if (b.cancelled) return "cancelled";
    const pending=(Number(b.total)||0)-(Number(b.advance)||0);
    if (pending<=0) return "paid";
    if ((Number(b.advance)||0)>0) return "partial";
    return "pending";
  }
  function statusText(b){
    const s=statusOf(b);
    if (s==="cancelled") return "Cancelled";
    if (s==="paid") return "Paid in full";
    const pending=(Number(b.total)||0)-(Number(b.advance)||0);
    if (s==="partial") return "Due "+fmtMoney(pending);
    return "Payment pending";
  }
  function slotsOverlap(a,b){ if (a==="full"||b==="full") return true; return a===b; }
  function findConflict(date,slot,excludeId){
    return state.bookings.find(b=> b.id!==excludeId && !b.cancelled && b.date===date && slotsOverlap(b.slot,slot)) || null;
  }
  function activeBookingsOn(dateStr){ return state.bookings.filter(b=>!b.cancelled && b.date===dateStr); }
  function dayFillClass(dateStr){
    const list = activeBookingsOn(dateStr);
    if (list.length===0) return "cal-empty";
    const slots = new Set(list.map(b=>b.slot));
    if (slots.has("full")) return "cal-full";
    if (slots.has("day") && slots.has("evening")) return "cal-full";
    if (slots.has("day")) return "cal-half-day";
    if (slots.has("evening")) return "cal-half-evening";
    return "cal-empty";
  }

  // ---------- local copy + offline queue ----------

  function applyOps(list, queue){
    let out = list.slice();
    queue.forEach(op=>{
      if (op.type === "upsert"){
        const i = out.findIndex(b=>b.id===op.booking.id);
        if (i>=0) out[i] = op.booking; else out.push(op.booking);
      } else if (op.type === "delete"){
        out = out.filter(b=>b.id!==op.id);
      }
    });
    return out;
  }
  function recompute(){ state.bookings = applyOps(state.remote, state.queue); }
  function persistLocal(){
    if (!state.docId) return;
    lsSet(cacheKey(state.docId), state.remote);
    lsSet(queueKey(state.docId), state.queue);
  }

  // ---------- change alerts (in-app banners + optional phone notifications) ----------

  function pushToast(text, type){
    const id = "t" + (++toastCounter);
    state.toasts.push({ id, text, type });
    render();
    setTimeout(()=>{
      state.toasts = state.toasts.filter(t=>t.id!==id);
      const el = document.querySelector('[data-toast="'+id+'"]');
      if (el) el.remove();
    }, 6000);
  }
  function notifyOS(title, body){
    try{
      if (typeof Notification!=="undefined" && Notification.permission==="granted"){
        new Notification(title, { body });
      }
    }catch(e){}
  }
  function snapshotFromBookings(list){
    const map = {};
    list.forEach(b=>{ map[b.id] = !!b.cancelled; });
    return map;
  }
  function saveSeen(){ if (state.docId) lsSet(seenKey(state.docId), snapshotFromBookings(state.bookings)); }
  function diffAndAnnounce(prevMap, newList){
    if (!prevMap) return;
    newList.forEach(b=>{
      const had = Object.prototype.hasOwnProperty.call(prevMap, b.id);
      if (!had){
        if (!b.cancelled){
          const text = "New booking: " + (b.customer||"Someone") + " — " + fmtDate(b.date);
          pushToast(text, "new"); notifyOS("New booking", text);
        }
      } else {
        const wasCancelled = prevMap[b.id];
        if (!wasCancelled && b.cancelled){
          const text = "Cancelled: " + (b.customer||"Someone") + " — " + fmtDate(b.date);
          pushToast(text, "cancel"); notifyOS("Booking cancelled", text);
        } else if (wasCancelled && !b.cancelled){
          const text = "Restored: " + (b.customer||"Someone") + " — " + fmtDate(b.date);
          pushToast(text, "restore"); notifyOS("Booking restored", text);
        }
      }
    });
  }
  function addIssue(text){
    state.issues.push({ id: "i" + Date.now() + Math.random().toString(36).slice(2,5), text });
    lsSet(issuesKey(state.docId), state.issues);
    pushToast(text, "cancel");
  }

  // ---------- shared storage over the internet (jsonbin.io) ----------

  function getDocIdFromUrl(){
    const p = new URLSearchParams(window.location.search);
    return (p.get("doc")||"").trim();
  }
  function resolveDocId(){ return getDocIdFromUrl() || lsGet(LAST_DOC_KEY, "") || ""; }
  function parseDocInput(text){
    const t = (text||"").trim();
    if (!t) return "";
    try{ const u = new URL(t); const d = u.searchParams.get("doc"); if (d) return d.trim(); }catch(e){}
    const m = t.match(/[?&]doc=([^&#\s]+)/);
    if (m) return decodeURIComponent(m[1]);
    return t;
  }

  function netError(e){
    const err = new Error("No internet connection");
    err.offline = true;
    err.cause = e;
    return err;
  }

  async function createDoc(){
    let res;
    try{
      res = await fetch(JSONBIN_BASE, {
        method:"POST",
        headers:{ "Content-Type":"application/json", "X-Master-Key": JSONBIN_KEY },
        body: JSON.stringify({ bookings: [] })
      });
    }catch(e){ throw netError(e); }
    if (!res.ok){
      let detail = "";
      try{ const j = await res.json(); detail = j && j.message ? " — "+j.message : ""; }catch(e){}
      throw new Error("Server rejected the request (HTTP "+res.status+")"+detail);
    }
    let data;
    try{ data = await res.json(); }catch(e){ throw new Error("Unexpected response when creating shared storage"); }
    const id = data && data.metadata && data.metadata.id;
    if (!id) throw new Error("No id returned when creating shared storage");
    return id;
  }

  async function loadBookings(id){
    const docId = id || state.docId;
    let res;
    try{
      res = await fetch(`${JSONBIN_BASE}/${encodeURIComponent(docId)}/latest`, {
        headers:{ "X-Master-Key": JSONBIN_KEY, "X-Bin-Meta":"false" },
        cache:"no-store"
      });
    }catch(e){ throw netError(e); }
    if (res.status === 404 || res.status === 422){
      const err = new Error("Booking link not found"); err.notFound = true; throw err;
    }
    if (!res.ok) throw new Error("Sync failed (HTTP "+res.status+")");
    let data;
    try{ data = await res.json(); }catch(e){ throw new Error("Unexpected response from server"); }
    return (data && Array.isArray(data.bookings)) ? data.bookings : [];
  }

  async function saveBookingsRemote(arr){
    let res;
    try{
      res = await fetch(`${JSONBIN_BASE}/${encodeURIComponent(state.docId)}`, {
        method:"PUT",
        headers:{ "Content-Type":"application/json", "X-Master-Key": JSONBIN_KEY },
        body: JSON.stringify({ bookings: arr })
      });
    }catch(e){ throw netError(e); }
    if (!res.ok) throw new Error("Save failed (HTTP "+res.status+")");
  }

  // Send pending changes to the server. Returns true when nothing is left waiting.
  async function flushQueue(){
    if (flushing) return false;
    if (!state.queue.length) return true;
    flushing = true;
    try{
      const latest = await loadBookings();
      let merged = latest.slice();
      const sent = state.queue.slice();
      const rejected = [];
      sent.forEach(op=>{
        if (op.type === "upsert"){
          const b = op.booking;
          if (!b.cancelled){
            const clash = merged.find(x=>x.id!==b.id && !x.cancelled && x.date===b.date && slotsOverlap(x.slot,b.slot));
            if (clash){ rejected.push({ booking:b, clash }); return; }
          }
          const i = merged.findIndex(x=>x.id===b.id);
          if (i>=0) merged[i] = b; else merged.push(b);
        } else if (op.type === "delete"){
          merged = merged.filter(x=>x.id!==op.id);
        }
      });
      await saveBookingsRemote(merged);
      state.remote = merged;
      state.queue = state.queue.filter(op=>!sent.includes(op));
      persistLocal();
      recompute();
      saveSeen();
      rejected.forEach(r=>{
        addIssue("Couldn't sync \u201C" + (r.booking.customer||"a booking") + "\u201D on " + fmtDate(r.booking.date) +
          " — that date was already taken by " + (r.clash.customer||"another booking") + ". Please enter it again for a free date.");
      });
      return state.queue.length === 0;
    }catch(e){
      return false;
    }finally{
      flushing = false;
    }
  }

  async function tryPullRemote(){
    try{
      const latest = await withTimeout(loadBookings(), 3500);
      state.remote = latest;
      persistLocal();
      recompute();
      return true;
    }catch(e){ return false; }
  }

  function sig(){ return JSON.stringify([state.bookings, state.syncStatus, state.queue.length, state.issues.length]); }

  async function refresh(){
    if (state.openSheet || !state.docId || state.needsSetup || state.bootError) return;
    if (refreshing) return;
    refreshing = true;
    try{
      if (state.queue.length) await flushQueue();
      const latest = await loadBookings();
      state.remote = latest;
      persistLocal();
      recompute();
      diffAndAnnounce(lsGet(seenKey(state.docId), null), state.bookings);
      saveSeen();
      state.syncStatus = "ok";
    }catch(e){
      state.syncStatus = ((e && e.offline) || !navigator.onLine) ? "offline" : "error";
    }finally{
      refreshing = false;
    }
    const s = sig();
    if (s !== lastSig){ lastSig = s; render(); }
  }

  // ---------- install to home screen ----------

  function setupInstall(){
    const standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
    state.installed = standalone;
    window.addEventListener("beforeinstallprompt", (e)=>{
      e.preventDefault();
      state.installEvt = e;
      if (!state.openSheet) render();
    });
    window.addEventListener("appinstalled", ()=>{
      state.installEvt = null; state.installed = true;
      if (!state.openSheet) render();
    });
    const ua = navigator.userAgent || "";
    const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    if (isIOS && !standalone && !lsGet(IOS_HINT_KEY, false)) state.showIosHint = true;
  }

  // Makes the installed app open straight into your team's bookings.
  function updateManifestLink(){
    try{
      if (!/^https?:$/.test(location.protocol)) return;
      const base = location.origin + location.pathname.replace(/[^/]*$/, "");
      const m = {
        name: "Hall Bookings", short_name: "Bookings",
        id: base, start_url: base + "?doc=" + encodeURIComponent(state.docId), scope: base,
        display: "standalone", orientation: "portrait",
        background_color: "#FAF6F0", theme_color: "#241B2E",
        icons: [
          { src: base+"icon-192.png", sizes: "192x192", type: "image/png", purpose: "any" },
          { src: base+"icon-512.png", sizes: "512x512", type: "image/png", purpose: "any" },
          { src: base+"icon-maskable-512.png", sizes: "512x512", type: "image/png", purpose: "maskable" }
        ]
      };
      const blob = new Blob([JSON.stringify(m)], { type: "application/manifest+json" });
      let link = document.querySelector('link[rel="manifest"]');
      if (!link){ link = document.createElement("link"); link.rel = "manifest"; document.head.appendChild(link); }
      link.href = URL.createObjectURL(blob);
    }catch(e){}
  }

  function registerSW(){
    if (!("serviceWorker" in navigator)) return;
    if (!(location.protocol === "https:" || location.hostname === "localhost")) return;
    const go = ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); };
    if (document.readyState === "complete") go(); else window.addEventListener("load", go);
  }

  // ---------- rendering ----------

  function render(){
    const app = document.getElementById("app");
    if (state.needsSetup){ app.innerHTML = renderSetup(); bindSetup(); return; }

    app.innerHTML = `
      ${renderToasts()}
      ${renderInstallBanner()}
      ${renderTopbar()}

      ${state.tab!=='calendar' ? renderSearch() : ""}

      ${state.dayDetail ? renderDayDetailSheet() : ""}
      ${state.openSheet ? renderSheet() : ""}

    attachHandlers();

  function renderSetup(){
    return `
      <div class="setup">
        <h1 class="display">Hall Bookings</h1>
        <p class="setup-lead">Connect this phone to your team's bookings.</p>
        <div class="field">
          <label for="setupInput">Paste your team link or booking ID</label>
          <input id="setupInput" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://…/?doc=…" value="${escapeAttr(state.setupText)}" />
        </div>
        ${state.setupError ? `<div class="saveerr">${escapeHtml(state.setupError)}</div>` : ""}
        <button class="primary setup-btn" id="setupConnect" ${state.setupBusy?"disabled":""}>${state.setupBusy?"Connecting...":"Connect"}</button>
        <div class="setup-or">or, if you are the very first person setting this up</div>
        <button class="ghost setup-btn" id="setupCreate" ${state.setupBusy?"disabled":""}>Create a new shared bookings space</button>
        <p class="setup-note">Everyone else on your team should use "Connect" with the same link, so you all see the same bookings.</p>
      </div>

  function bindSetup(){
    const input = document.getElementById("setupInput");
    if (input) input.addEventListener("input", (e)=>{ state.setupText = e.target.value; });
    const connect = document.getElementById("setupConnect");
    if (connect) connect.addEventListener("click", async ()=>{
      const id = parseDocInput(state.setupText);
      if (!id){ state.setupError = "Paste your team link or booking ID first."; render(); return; }
      state.setupBusy = true; state.setupError = ""; render();
      try{
        const list = await loadBookings(id);
        state.setupBusy = false;
        await startWithDoc(id, list);
      }catch(e){
        state.setupBusy = false;
        state.setupError = e.notFound ? "That link or ID wasn't found. Check it and try again."
          : (e.offline ? "No internet connection. This phone needs to connect once to get set up."
          : "Couldn't connect (" + (e.message||"unknown error") + ").");
        render();
      }
    });
    const create = document.getElementById("setupCreate");
    if (create) create.addEventListener("click", async ()=>{
      state.setupBusy = true; state.setupError = ""; render();
      try{
        const id = await createDoc();
        state.setupBusy = false;
        state.justShared = true;
        await startWithDoc(id, []);
      }catch(e){
        state.setupBusy = false;
        state.setupError = e.offline ? "No internet connection. This phone needs to connect once to get set up."
          : "Couldn't create it (" + (e.message||"unknown error") + ").";
        render();
      }
    });
  }

      lsSet(LAST_DOC_KEY, "");
      try{ const u = new URL(window.location.href); u.searchParams.delete("doc"); window.history.replaceState({}, "", u.toString()); }catch(e){}

  function alertsLabel(){
    if (typeof Notification === "undefined") return "Alerts unsupported";
    if (Notification.permission === "granted") return "\uD83D\uDD14 Alerts on";
    if (Notification.permission === "denied") return "Alerts blocked";
    return "Enable alerts";
  }

  function statusLine(){
    const n = state.queue.length;
    const plural = n === 1 ? "change" : "changes";
    if (state.syncStatus === "offline"){
      return n ? `Offline \u2014 ${n} ${plural} saved on this phone, will sync when signal returns`
               : "Offline \u2014 showing saved bookings. New changes will sync when signal returns";
    }
    if (n) return `${n} ${plural} waiting to sync`;
    if (state.syncStatus === "error") return "Can't reach the server \u2014 retrying";
    return "Shared with your team \u00B7 updates live over data or Wi-Fi";
  }
  function dotClass(){
    if (state.syncStatus === "offline" || state.syncStatus === "error") return "err";

  function tabBtn(id,label){ return `<button class="tab ${state.tab===id?'active':''}" data-tab="${id}">${label}</button>`; }

  function renderSearch(){
    return `<div class="searchwrap"><input id="searchInput" type="text" placeholder="Search by customer or phone" value="${escapeAttr(state.search)}" /></div>`;
  }

  function visibleBookings(){
    const today = todayStr();
    let list = state.bookings.filter(b=>{
      if (state.tab==="cancelled") return b.cancelled;
      if (b.cancelled) return false;
      if (state.tab==="upcoming") return b.date >= today;
      return b.date < today;
    });
    if (state.search.trim()){
      const q = state.search.trim().toLowerCase();
      list = list.filter(b => (b.customer||"").toLowerCase().includes(q) || (b.phone||"").toLowerCase().includes(q));
    }
    list.sort((a,b)=> state.tab==="upcoming" ? a.date.localeCompare(b.date) : b.date.localeCompare(a.date));
    return list;
  }

  function renderList(){
    const list = visibleBookings();
    if (list.length===0){
      const msgs = {
        upcoming:"No upcoming bookings yet. Tap \u201CAdd New Booking\u201D to add the first one.",
        past:"No past bookings to show.",
        cancelled:"No cancelled bookings."
      };
      return `<div class="empty">${msgs[state.tab]||""}</div>`;
    }
    const pendingIds = new Set(state.queue.filter(o=>o.type==="upsert").map(o=>o.booking.id));
    return list.map(b=>{
      const s = statusOf(b);
      return `
        <div class="row status-${s}" data-view="${b.id}">
          <div class="row-top">

          ${b.eventType ? `<div class="row-event">${escapeHtml(b.eventType)}</div>` : ""}
          <div class="row-bottom">
            <span class="pill status-${s}">${statusText(b)}</span>
            ${pendingIds.has(b.id) ? `<span class="meta">waiting to sync</span>` : (b.createdBy ? `<span class="meta">by ${escapeHtml(b.createdBy)}</span>` : "")}
          </div>
        </div>
      `;
    }).join("");
  }

  function renderCalendar(){
    const m = state.calMonth;
    const y = m.getFullYear(), mo = m.getMonth();
    const startWeekday = new Date(y,mo,1).getDay();
    const totalDays = daysInMonth(m);
    const todayIso = todayStr();
    let cells = "";
    for (let i=0;i<startWeekday;i++){ cells += `<div class="cal-cell cal-blank"></div>`; }
    for (let day=1; day<=totalDays; day++){
      const dateStr = isoOf(y,mo,day);
      const cls = dayFillClass(dateStr);
      const isToday = dateStr===todayIso ? "cal-today" : "";
      cells += `<div class="cal-cell ${cls} ${isToday}" data-caldate="${dateStr}"><span class="cal-daynum">${day}</span></div>`;
    }
    return `
      <div class="cal-header">
        <button class="cal-nav" id="calPrev">&lsaquo;</button>
        <div class="cal-month display">${monthLabel(m)}</div>
        <button class="cal-nav" id="calNext">&rsaquo;</button>

      <div class="cal-weekdays"><span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span></div>

        <span><i class="dot dot-full"></i>Booked</span>
        <span><i class="dot dot-half"></i>Partly booked</span>
        <span><i class="dot dot-empty"></i>Available</span>
      </div>
    `;

  function blankDraft(){
    return { id:null, customer:"", phone:"", date:"", slot:"full", eventType:"", total:"", advance:"", notes:"", cancelled:false, createdBy:"" };
  }

  function renderDayDetailSheet(){
    const dateStr = state.dayDetail;
    const list = activeBookingsOn(dateStr);
    const slotsTaken = new Set(list.map(b=>b.slot));
    const fullyBlocked = slotsTaken.has("full") || (slotsTaken.has("day") && slotsTaken.has("evening"));
    let availableSlot = null;
    if (!fullyBlocked){
      if (list.length===0) availableSlot = "full";
      else if (!slotsTaken.has("day")) availableSlot = "day";
      else if (!slotsTaken.has("evening")) availableSlot = "evening";
    }
    const rows = list.map(b=>{
      const s = statusOf(b);
      return `
        <div class="row status-${s}" data-daydetail-view="${b.id}">
          <div class="row-top">
            <div class="row-slot">${SLOT_LABEL[b.slot]||"Full day"}</div>
            <div class="row-amt"><b>${fmtMoney(b.total)}</b></div>

  // ---------- events ----------

  function attachHandlers(){
    const app = document.getElementById("app");

    const nameInput = document.getElementById("myNameInput");
    if (nameInput) nameInput.addEventListener("change",(e)=>{ state.myName = e.target.value; lsSet(NAME_KEY, state.myName); });

    app.querySelectorAll("[data-toast]").forEach(t=>{
      t.addEventListener("click", ()=>{
        const id = t.getAttribute("data-toast");
        state.toasts = state.toasts.filter(x=>x.id!==id);
        t.remove();
      });
    });

    app.querySelectorAll("[data-issue]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = btn.getAttribute("data-issue");
        state.issues = state.issues.filter(x=>x.id!==id);
        lsSet(issuesKey(state.docId), state.issues);
        render();
      });
    });

    const installBtn = document.getElementById("installBtn");
    if (installBtn) installBtn.addEventListener("click", async ()=>{
      const evt = state.installEvt;
      if (!evt) return;
      state.installEvt = null;
      try{ evt.prompt(); await evt.userChoice; }catch(e){}
      render();
    });
    const installDismiss = document.getElementById("installDismiss");
    if (installDismiss) installDismiss.addEventListener("click", ()=>{ state.installDismissed = true; render(); });
    const iosDismiss = document.getElementById("iosDismiss");
    if (iosDismiss) iosDismiss.addEventListener("click", ()=>{ state.showIosHint = false; lsSet(IOS_HINT_KEY, true); render(); });

    const alertsBtn = document.getElementById("enableAlerts");
    if (alertsBtn) alertsBtn.addEventListener("click", async ()=>{
      if (typeof Notification === "undefined"){
        alert("This browser doesn't support phone notifications. You'll still see in-app alerts while this page is open.");
        return;
      }
      if (Notification.permission === "granted"){ pushToast("Alerts are already on.", "new"); return; }
      if (Notification.permission === "denied"){
        alert("Notifications are blocked for this site. Enable them in your browser/site settings, then reload the page.");
        return;
      }
      try{
        const result = await Notification.requestPermission();
        render();
        if (result === "granted") pushToast("Alerts enabled \u2014 you'll get notified of new and cancelled bookings while this page is open.", "restore");
      }catch(e){}
    });

    const copyBtn = document.getElementById("copyLink");
    if (copyBtn) copyBtn.addEventListener("click", async ()=>{
      try{
        await navigator.clipboard.writeText(shareUrl());
        copyBtn.textContent = "Copied!";
        setTimeout(()=>{ copyBtn.textContent = "Copy link"; }, 1500);
      }catch(e){
        prompt("Copy this link:", shareUrl());
      }
    });

    app.querySelectorAll("[data-tab]").forEach(btn=>{
      btn.addEventListener("click",()=>{ state.tab = btn.getAttribute("data-tab"); render(); });
    });

    const searchInput = document.getElementById("searchInput");
    if (searchInput){
      searchInput.addEventListener("input",(e)=>{
        state.search = e.target.value; render();
        const el = document.getElementById("searchInput");
        el.focus(); const v=el.value; el.setSelectionRange(v.length,v.length);
      });
    }

    const fab = document.getElementById("fabAdd");
    if (fab) fab.addEventListener("click", ()=>{
      state.draft = blankDraft();
      state.draft.date = todayStr();
      state.draft.createdBy = state.myName;
      state.openSheet = "new"; state.editingId = null; state.conflict = null; state.saveError = "";
      render();
    });

    app.querySelectorAll("[data-view]").forEach(row=>{
      row.addEventListener("click", ()=>{
        const id = row.getAttribute("data-view");
        const b = state.bookings.find(x=>x.id===id);
        if (!b) return;
        state.draft = Object.assign({}, b);
        state.editingId = id; state.openSheet = "edit"; state.conflict = null; state.saveError = "";
        render();
      });
    });

    const calPrev = document.getElementById("calPrev");
    if (calPrev) calPrev.addEventListener("click", ()=>{ state.calMonth = addMonths(state.calMonth,-1); render(); });
    const calNext = document.getElementById("calNext");
    if (calNext) calNext.addEventListener("click", ()=>{ state.calMonth = addMonths(state.calMonth,1); render(); });

    app.querySelectorAll("[data-caldate]").forEach(cell=>{
      cell.addEventListener("click", ()=>{ state.dayDetail = cell.getAttribute("data-caldate"); render(); });
    });

    if (state.dayDetail) bindDayDetailHandlers();
    if (state.openSheet) bindSheetHandlers();
  }

  function bindDayDetailHandlers(){
    const closeBtn = document.getElementById("closeDayDetail");
    if (closeBtn) closeBtn.addEventListener("click", ()=>{ state.dayDetail=null; render(); });
    const backdrop = document.getElementById("dayDetailBackdrop");
    if (backdrop) backdrop.addEventListener("click", (e)=>{ if (e.target.id==="dayDetailBackdrop"){ state.dayDetail=null; render(); } });
    document.querySelectorAll("[data-daydetail-view]").forEach(row=>{
      row.addEventListener("click", ()=>{
        const id = row.getAttribute("data-daydetail-view");
        const b = state.bookings.find(x=>x.id===id);
        if (!b) return;
        state.dayDetail = null;
        state.draft = Object.assign({}, b);
        state.editingId = id; state.openSheet = "edit"; state.conflict = null; state.saveError = "";
        render();
      });
    });
    const addBtn = document.getElementById("addForDay");
    if (addBtn) addBtn.addEventListener("click", ()=>{
      const dateStr = state.dayDetail;
      const list = activeBookingsOn(dateStr);
      const slotsTaken = new Set(list.map(b=>b.slot));
      let slot = "full";
      if (slotsTaken.has("day")) slot = "evening"; else if (slotsTaken.has("evening")) slot = "day";
      state.dayDetail = null;
      state.draft = blankDraft();
      state.draft.date = dateStr;
      state.draft.slot = slot;
      state.draft.createdBy = state.myName;
      state.openSheet = "new"; state.editingId = null; state.conflict = null; state.saveError = "";
      render();
    });
  }

  function closeSheetState(){
    state.openSheet = null; state.draft = null; state.conflict = null;
    state.saveError = ""; state.editingId = null; state.saving = false;
  }

  function bindSheetHandlers(){
    const get = id => document.getElementById(id);
    const d = state.draft;
    const closeAll = ()=>{ closeSheetState(); render(); };

    get("closeSheet").addEventListener("click", closeAll);
    get("cancelForm").addEventListener("click", closeAll);
    get("sheetBackdrop").addEventListener("click",(e)=>{ if (e.target.id==="sheetBackdrop") closeAll(); });

    const idMap = { customer:"f_customer", phone:"f_phone", date:"f_date", slot:"f_slot", eventType:"f_event", total:"f_total", advance:"f_advance", notes:"f_notes" };
    Object.keys(idMap).forEach(f=>{
      const el = get(idMap[f]);
      if (!el) return;
      const evt = el.tagName==="SELECT" ? "change" : "input";
      el.addEventListener(evt, ()=>{
        d[f] = el.value;
        if (f==="date"||f==="slot"){ state.conflict = d.date ? findConflict(d.date,d.slot,state.editingId) : null; }
        if (f==="total"||f==="advance"){ updatePendingLineOnly(); }
        else { render(); restoreFocus(idMap[f]); }
      });
    });

    get("saveForm").addEventListener("click", ()=>handleSave(false));

    const cancelBtn = get("cancelBooking");
    if (cancelBtn) cancelBtn.addEventListener("click", ()=>{ d.cancelled = true; handleSave(true); });

    const restoreBtn = get("restoreBooking");
    if (restoreBtn) restoreBtn.addEventListener("click", ()=>{
      d.cancelled = false;
      state.conflict = findConflict(d.date, d.slot, state.editingId);
      if (state.conflict){ render(); return; }
      handleSave(true);
    });

    const deleteBtn = get("deleteBooking");
    if (deleteBtn) deleteBtn.addEventListener("click", async ()=>{
      if (!confirm("Delete this booking permanently? This can't be undone.")) return;
      const id = state.editingId;
      state.queue.push({ type:"delete", id });
      closeSheetState();
      persistLocal(); recompute(); saveSeen(); render();
      afterFlush(await flushQueue());
    });
  }

  function restoreFocus(id){
    const el = document.getElementById(id);
    if (el){ el.focus(); if (el.setSelectionRange && typeof el.value==="string"){ const len=el.value.length; try{el.setSelectionRange(len,len);}catch(e){} } }
  }

  function updatePendingLineOnly(){
    const d = state.draft;
    const pending = (Number(d.total)||0) - (Number(d.advance)||0);
    const line = document.querySelector(".pending-line b");
    if (line) line.textContent = fmtMoney(pending);
  }

  function afterFlush(ok){
    if (ok){
      state.syncStatus = "ok";
      lastSig = sig();
      render();
    } else if (state.queue.length){
      state.syncStatus = navigator.onLine ? "error" : "offline";
      lastSig = sig();
      pushToast("Saved on this phone. It will sync when the signal returns.", "new");
    }
  }

  async function handleSave(skipValidation){
    const d = state.draft;
    if (!skipValidation){
      if (!d.customer.trim()){ alert("Enter the customer's name."); return; }
      if (!d.date){ alert("Pick an event date."); return; }
      if (!d.total || Number(d.total)<=0){ alert("Enter the total amount."); return; }
    }

    state.saving = true; state.saveError = ""; render();

    // If there's signal, grab the newest bookings first so we catch a date someone else just took.
    await tryPullRemote();

    const conflict = d.cancelled ? null : findConflict(d.date, d.slot, state.editingId);
    if (conflict){ state.conflict = conflict; state.saving = false; render(); return; }

    let booking;
    if (state.editingId){
      const existing = state.bookings.find(b=>b.id===state.editingId) || {};
      booking = Object.assign({}, existing, d, { updatedAt: Date.now() });
    } else {
      booking = Object.assign({}, d, { id: uid(), createdBy: state.myName || d.createdBy || "", updatedAt: Date.now() });
    }

    state.queue.push({ type:"upsert", booking });
    closeSheetState();
    persistLocal(); recompute(); saveSeen(); render();
    afterFlush(await flushQueue());
  }

  // ---------- start up ----------

  async function initialSync(){
    const hadCache = lsHas(cacheKey(state.docId));
    try{
      if (state.queue.length) await flushQueue();
      const latest = await loadBookings();
      state.remote = latest;
      persistLocal();
      recompute();
      diffAndAnnounce(lsGet(seenKey(state.docId), null), state.bookings);
      saveSeen();
      state.syncStatus = "ok";
    }catch(e){
      if (e && e.notFound){
        state.bootError = "This booking link wasn't found.";
        state.bootErrorTech = "Check the link or booking ID with your team.";
        return;
      }
      if (!hadCache){
        state.bootError = "Load failed";
        state.bootErrorTech = (e && e.message) ? e.message : "Unknown error";
        return;
      }
      state.syncStatus = ((e && e.offline) || !navigator.onLine) ? "offline" : "error";
    }
  }

  function startLoops(){
    if (loopsStarted) return;
    loopsStarted = true;
    setInterval(refresh, 6000);
    document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="visible") refresh(); });
    window.addEventListener("online", ()=>{ refresh(); });
    window.addEventListener("offline", ()=>{
      state.syncStatus = "offline";
      if (!state.openSheet && state.docId && !state.needsSetup && !state.bootError){ lastSig = sig(); render(); }
    });
  }

  async function startWithDoc(id, initialRemote){
    state.docId = id; state.needsSetup = false; state.bootError = ""; state.bootErrorTech = "";
    lsSet(LAST_DOC_KEY, id);
    try{
      const u = new URL(window.location.href);
      if (u.searchParams.get("doc") !== id){ u.searchParams.set("doc", id); window.history.replaceState({}, "", u.toString()); }
    }catch(e){}
    updateManifestLink();
    if (initialRemote) lsSet(cacheKey(id), initialRemote);
    state.remote = lsGet(cacheKey(id), []);
    state.queue = lsGet(queueKey(id), []);
    state.issues = lsGet(issuesKey(id), []);
    recompute();
    state.syncStatus = "loading";
    render();                      // show the saved copy straight away, even with no signal
    if (initialRemote){ saveSeen(); state.syncStatus = "ok"; }
    else { await initialSync(); }
    lastSig = sig();
    render();
    startLoops();
  }

  async function boot(){
    state.bootError = ""; state.bootErrorTech = "";
    if (!state.calMonth) state.calMonth = startOfMonth(new Date());
    state.myName = lsGet(NAME_KEY, "");
    if (!booted){ booted = true; registerSW(); setupInstall(); }
    const id = resolveDocId();
    if (!id){ state.needsSetup = true; render(); return; }
    await startWithDoc(id);
  }

  boot();
})();

</script>
</body>
</html>
